# Overrides live here, not in package.json `pnpm.overrides`: Dependabot
# drops the lockfile `overrides:` block for the latter, which breaks every
# frozen install.
overrides:
  dompurify: ">=3.4.11"
  mermaid: ">=11.15.0"
  uuid: ">=11.1.1"
  markdown-it: ">=14.2.0"
  linkify-it: ">=5.0.1"
  brace-expansion: ">=5.0.6"
  fast-uri: ">=3.1.2"
  postcss: ">=8.5.10"
