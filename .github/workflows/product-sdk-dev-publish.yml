name: "product-sdk: Dev publish"

# Manually-triggered publish of an UNRELEASED branch to npm under the `dev`
# dist-tag, so a consumer can integrate against in-flight SDK work without
# waiting for a release wave.
#
# Modelled on bulletin-deploy, which publishes the same way: a version like
# `0.15.2-dev.1282.0` is "the 0th dev cut of PR 1282, ahead of 0.15.2", carried
# on the `dev` tag so `npm install` (which resolves `@latest`) can never pick it
# up by accident.
#
# Two ways in, because GitHub only exposes `workflow_dispatch` for workflows
# that already live on the default branch:
#
#   1. Label the PR `dev-publish-<iteration>`, e.g. `dev-publish-0`. A
#      `pull_request` workflow runs the file as it exists in the PR's own head
#      branch, so this works while the workflow is still unmerged. Re-cut by
#      adding `dev-publish-1`, and so on.
#   2. Once this file is on `main`: Actions → "product-sdk: Dev publish" → Run
#      workflow → pr: 312, iteration: 0.
#
# Both paths converge on the same two values and the same guards. The label
# carries the iteration rather than deriving one from `github.run_number`
# because a re-run must be able to reproduce a version, not invent a new one.
#
# Why this cannot reuse product-sdk-release.yml: that workflow consumes
# changesets, commits `chore: version packages`, tags, and publishes to
# `@latest`. All four are wrong for a throwaway cut off a feature branch. This
# one writes nothing back to the repo — the version bump lives only in the
# runner's working tree.
#
# Why it stages `pending-changesets/`: this repo parks in-flight changesets
# there precisely so they do NOT ship on the next push to main (see
# pending-changesets/README.md). A dev cut is the one moment we DO want them
# applied, so they are copied into `.changeset/` on the runner and never
# committed.

on:
    workflow_dispatch:
        inputs:
            pr:
                description: "PR number this cut comes from (e.g. 312). Names the version: 0.16.0-dev.<pr>.<iteration>."
                type: string
                required: true
            iteration:
                description: "Bump for each re-cut of the same PR. Start at 0."
                type: string
                required: true
                default: "0"
    pull_request:
        types: [labeled]

permissions:
    contents: read

concurrency:
    group: product-sdk-dev-publish-${{ github.event.pull_request.number || inputs.pr }}
    cancel-in-progress: false

defaults:
    run:
        working-directory: product-sdk

jobs:
    dev-publish:
        # Every other label is ignored. The same-repo check is belt and braces:
        # a fork PR gets no `id-token` and no secrets, so it would fail at the
        # publish step anyway, but failing here says why.
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (startsWith(github.event.label.name, 'dev-publish-') &&
            github.event.pull_request.head.repo.full_name == github.repository)
        name: "Publish dev.${{ github.event.pull_request.number || inputs.pr }}"
        runs-on: parity-default
        timeout-minutes: 20
        permissions:
            contents: read
            # Trusted publishing: npm mints a short-lived credential from this
            # token rather than a long-lived NPM_TOKEN, and attaches provenance.
            id-token: write
        steps:
            - name: Resolve and validate the cut
              id: cut
              # Overrides `defaults.run.working-directory`, which points inside
              # the repo. This step runs BEFORE checkout so a bad input fails
              # in seconds, and that directory does not exist yet.
              working-directory: ${{ github.workspace }}
              env:
                  EVENT: ${{ github.event_name }}
                  INPUT_PR: ${{ inputs.pr }}
                  INPUT_ITERATION: ${{ inputs.iteration }}
                  LABEL: ${{ github.event.label.name }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  set -euo pipefail
                  if [ "$EVENT" = "workflow_dispatch" ]; then
                    PR="$INPUT_PR"
                    ITERATION="$INPUT_ITERATION"
                  else
                    PR="$PR_NUMBER"
                    # `dev-publish-3` → 3. The job-level `if` already required
                    # the prefix, so this only has to strip it.
                    ITERATION="${LABEL#dev-publish-}"
                  fi
                  # Both land inside an npm version string, so they are digits
                  # only. Anything else could smuggle a second dist-tag or an
                  # extra semver segment past the prerelease check below — and
                  # on the label path the value is whatever someone typed into
                  # a label, so this is the only thing standing between a typo
                  # and a malformed publish.
                  [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be digits, got '$PR'"; exit 1; }
                  [[ "$ITERATION" =~ ^[0-9]+$ ]] || { echo "::error::iteration must be digits, got '$ITERATION'"; exit 1; }
                  echo "pr=$PR" >> "$GITHUB_OUTPUT"
                  echo "iteration=$ITERATION" >> "$GITHUB_OUTPUT"
                  echo "::notice::Cutting dev.$PR.$ITERATION"

            - name: Refuse to cut a dev release from main
              if: github.ref == 'refs/heads/main'
              # Pre-checkout, same as above.
              working-directory: ${{ github.workspace }}
              run: |
                  echo "::error::main publishes through product-sdk-release.yml. A dev cut is for unmerged branches."
                  exit 1

            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
              with:
                  version: 10

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "22"
                  registry-url: "https://registry.npmjs.org"
                  cache: "pnpm"
                  cache-dependency-path: product-sdk/pnpm-lock.yaml

            # Node 22 bundles npm 10. Trusted publishing (OIDC) needs npm >=
            # 11.5.1 — older npm ignores the id-token, looks for a token that
            # isn't there, and fails the publish. Same pin bulletin-deploy uses.
            - run: npm install -g npm@11.17.0

            - run: pnpm install --frozen-lockfile

            # The whole point of a dev cut: apply the changesets that are
            # deliberately parked out of the release path. Copied, not moved —
            # nothing is committed from this runner.
            - name: Stage pending changesets
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  staged=0
                  for f in pending-changesets/*.md; do
                    [ "$(basename "$f")" = "README.md" ] && continue
                    cp "$f" ".changeset/$(basename "$f")"
                    staged=$((staged + 1))
                  done
                  if [ "$staged" -eq 0 ] && ! ls .changeset/*.md 2>/dev/null | grep -qv README.md; then
                    echo "::error::No changesets to publish. Add one under pending-changesets/ first."
                    exit 1
                  fi
                  echo "::notice::Staged $staged pending changeset(s)"

            # `--snapshot` bypasses the normal version bump and stamps every
            # affected package with a prerelease built from the tag. The
            # template is pinned to `{tag}` alone so the version is reproducible
            # from the inputs — the default appends a timestamp, which would
            # make the same PR+iteration publish two different versions.
            # The baseline the assertion below diffs against, captured
            # before anything mutates a package.json.
            - name: Record versions before the bump
              run: |
                  set -euo pipefail
                  for pkg in packages/*/package.json; do
                    private=$(jq -r '.private // false' "$pkg")
                    [ "$private" = "true" ] && continue
                    echo "$(jq -r '.name' "$pkg") $(jq -r '.version' "$pkg")"
                  done > "$RUNNER_TEMP/versions-before.txt"

            - name: Version as a snapshot
              env:
                  PR: ${{ steps.cut.outputs.pr }}
                  ITERATION: ${{ steps.cut.outputs.iteration }}
              run: |
                  set -euo pipefail
                  pnpm changeset version \
                    --snapshot "dev.${PR}.${ITERATION}" \
                    --snapshot-prerelease-template '{tag}'

            # A snapshot version MUST carry a prerelease segment. Without one,
            # `changeset publish` would push to `@latest` and a dev cut would
            # silently become the version every consumer installs.
            #
            # Scoped to what CHANGED, not to every package. A snapshot bump only
            # touches packages the changesets name; the rest keep their released
            # versions, and `changeset publish` skips them because those
            # versions are already on the registry. Asserting over all packages
            # therefore fails on ones this cut never publishes. The property
            # that actually has to hold is narrower: everything this cut ships
            # is a prerelease.
            - name: Assert everything this cut publishes is a prerelease
              run: |
                  set -euo pipefail
                  fail=0
                  changed=0
                  for pkg in packages/*/package.json; do
                    private=$(jq -r '.private // false' "$pkg")
                    [ "$private" = "true" ] && continue
                    name=$(jq -r '.name' "$pkg")
                    version=$(jq -r '.version' "$pkg")
                    before=$(awk -v n="$name" '$1 == n { print $2 }' "$RUNNER_TEMP/versions-before.txt")
                    [ "$version" = "$before" ] && continue
                    changed=$((changed + 1))
                    case "$version" in
                      *-dev.*) echo "::notice::$name $before -> $version" ;;
                      *) echo "::error::$name is $version, not a dev prerelease"; fail=1 ;;
                    esac
                  done
                  # A cut that bumps nothing would publish nothing and report
                  # success, which reads as "it shipped".
                  if [ "$changed" -eq 0 ]; then
                    echo "::error::The snapshot bump changed no versions - nothing to publish."
                    fail=1
                  fi
                  [ "$fail" -eq 0 ]

            - run: pnpm build

            # `--tag dev` is what keeps `@latest` untouched. Consumers opt in
            # explicitly with `npm install @parity/product-sdk-host@dev` or by
            # pinning the exact version.
            - name: Publish under the dev dist-tag
              run: pnpm changeset publish --tag dev --no-git-tag

            - name: Report what shipped
              run: |
                  set -euo pipefail
                  for pkg in packages/*/package.json; do
                    private=$(jq -r '.private // false' "$pkg")
                    [ "$private" = "true" ] && continue
                    name=$(jq -r '.name' "$pkg")
                    version=$(jq -r '.version' "$pkg")
                    # Unchanged packages were skipped by `changeset publish`;
                    # listing them here would claim a release that never went out.
                    before=$(awk -v n="$name" '$1 == n { print $2 }' "$RUNNER_TEMP/versions-before.txt")
                    [ "$version" = "$before" ] && continue
                    echo "::notice::$name@$version"
                  done
