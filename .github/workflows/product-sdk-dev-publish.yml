name: "product-sdk: Dev publish"

# Publishes an UNRELEASED branch to npm under the `dev` dist-tag, so a consumer
# can integrate against in-flight SDK work without waiting for a release wave.
#
# It is modelled on bulletin-deploy, which publishes the same way: a version
# like `0.0.0-dev.312.0` is "the 0th dev cut of PR 312", carried on the `dev`
# tag so `npm install`, which resolves `@latest`, can never pick it up by
# accident.
#
# There are two ways in, because GitHub only exposes `workflow_dispatch` for
# workflows that already live on the default branch:
#
#   1. Label the PR `dev-publish-<iteration>`, for example `dev-publish-0`. A
#      `pull_request` workflow runs the file as it exists in the PR head
#      branch, so this works while the workflow is still unmerged. Re-cut by
#      adding `dev-publish-1`, and so on.
#   2. Once this file is on `main`, run "product-sdk: Dev publish" from the
#      Actions tab with pr 312 and iteration 0.
#
# Both paths converge on the same two values and the same guards. The label
# carries the iteration rather than deriving one from `github.run_number`
# because a re-run must be able to reproduce a version, not invent a new one.
#
# This cannot reuse product-sdk-release.yml. That workflow consumes
# changesets, commits `chore: version packages`, tags, and publishes to
# `@latest`. All four are wrong for a throwaway cut off a feature branch. This
# one writes nothing back to the repository. The version bump lives only in
# the working tree on the runner.
#
# It stages `pending-changesets/` because this repository parks in-flight
# changesets there precisely so they do NOT ship on the next push to main, as
# pending-changesets/README.md explains. A dev cut is the one moment we DO
# want them applied, so they are copied into `.changeset/` on the runner and
# never committed.

on:
    workflow_dispatch:
        inputs:
            pr:
                description: "PR number this cut comes from, for example 312. The version becomes 0.0.0-dev.<pr>.<iteration>."
                type: string
                required: true
            iteration:
                description: "Bump for each re-cut of the same PR. Start at 0."
                type: string
                required: true
                default: "0"
    pull_request:
        types: [labeled]

permissions:
    contents: read

concurrency:
    group: product-sdk-dev-publish-${{ github.event.pull_request.number || inputs.pr }}
    cancel-in-progress: false

defaults:
    run:
        working-directory: product-sdk

jobs:
    dev-publish:
        # The same-repository check is belt and braces: a fork PR gets no
        # secrets, so it would fail at the publish step anyway, but failing
        # here says why.
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (startsWith(github.event.label.name, 'dev-publish-') &&
            github.event.pull_request.head.repo.full_name == github.repository)
        name: "Publish dev.${{ github.event.pull_request.number || inputs.pr }}"
        runs-on: parity-default
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - name: Resolve and validate the cut
              id: cut
              # Overrides `defaults.run.working-directory`, which points inside
              # the repository. This step runs BEFORE checkout so a bad input
              # fails in seconds, and that directory does not exist yet.
              working-directory: ${{ github.workspace }}
              env:
                  EVENT: ${{ github.event_name }}
                  INPUT_PR: ${{ inputs.pr }}
                  INPUT_ITERATION: ${{ inputs.iteration }}
                  LABEL: ${{ github.event.label.name }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  set -euo pipefail
                  if [ "$EVENT" = "workflow_dispatch" ]; then
                    PR="$INPUT_PR"
                    ITERATION="$INPUT_ITERATION"
                  else
                    PR="$PR_NUMBER"
                    # `dev-publish-3` becomes 3. The job-level `if` already
                    # required the prefix, so this only has to strip it.
                    ITERATION="${LABEL#dev-publish-}"
                  fi
                  # Both land inside an npm version string, so they are digits
                  # only. Anything else could smuggle a second dist-tag or an
                  # extra semver segment past the prerelease check below. On
                  # the label path the value is whatever someone typed into a
                  # label, so this is the only thing standing between a typo
                  # and a malformed publish.
                  [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be digits, got '$PR'"; exit 1; }
                  [[ "$ITERATION" =~ ^[0-9]+$ ]] || { echo "::error::iteration must be digits, got '$ITERATION'"; exit 1; }
                  echo "pr=$PR" >> "$GITHUB_OUTPUT"
                  echo "iteration=$ITERATION" >> "$GITHUB_OUTPUT"
                  echo "::notice::Cutting dev.$PR.$ITERATION"

            - name: Refuse to cut a dev release from main
              if: github.ref == 'refs/heads/main'
              # This also runs before checkout.
              working-directory: ${{ github.workspace }}
              run: |
                  echo "::error::main publishes through product-sdk-release.yml. A dev cut is for unmerged branches."
                  exit 1

            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
              with:
                  version: 10

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "22"
                  registry-url: "https://registry.npmjs.org"
                  cache: "pnpm"
                  cache-dependency-path: product-sdk/pnpm-lock.yaml

            - run: pnpm install --frozen-lockfile

            - name: Stage pending changesets
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  staged=0
                  for changeset in pending-changesets/*.md; do
                    [ "$(basename "$changeset")" = "README.md" ] && continue
                    cp "$changeset" ".changeset/$(basename "$changeset")"
                    staged=$((staged + 1))
                  done
                  if [ "$staged" -eq 0 ] && ! ls .changeset/*.md 2>/dev/null | grep -qv README.md; then
                    echo "::error::No changesets to publish. Add one under pending-changesets/ first."
                    exit 1
                  fi
                  echo "::notice::Staged $staged pending changeset(s)"

            - name: Record versions before the bump
              run: |
                  set -euo pipefail
                  for manifest in packages/*/package.json; do
                    private=$(jq -r '.private // false' "$manifest")
                    [ "$private" = "true" ] && continue
                    echo "$(jq -r '.name' "$manifest") $(jq -r '.version' "$manifest")"
                  done > "$RUNNER_TEMP/versions-before.txt"

            # `--snapshot` bypasses the normal version bump and stamps every
            # affected package with a prerelease built from the tag. The
            # template is pinned to `{tag}` alone so the version is reproducible
            # from the inputs. The default appends a timestamp, which would make
            # the same PR and iteration publish two different versions.
            - name: Version as a snapshot
              env:
                  PR: ${{ steps.cut.outputs.pr }}
                  ITERATION: ${{ steps.cut.outputs.iteration }}
              run: |
                  set -euo pipefail
                  pnpm changeset version \
                    --snapshot "dev.${PR}.${ITERATION}" \
                    --snapshot-prerelease-template '{tag}'

            # A snapshot version MUST carry a prerelease segment, so semver
            # ranges never match a dev cut.
            #
            # The check is scoped to what CHANGED, not to every package. A
            # snapshot bump only touches packages the changesets name. The rest
            # keep their released versions, and npm_publish_automation skips
            # them because those versions are already on the registry.
            # Asserting over all packages therefore fails on ones this cut
            # never publishes. The property that actually has to hold is
            # narrower: everything this cut ships is a prerelease.
            - name: Assert everything this cut publishes is a prerelease
              run: |
                  set -euo pipefail
                  fail=0
                  changed=0
                  for manifest in packages/*/package.json; do
                    private=$(jq -r '.private // false' "$manifest")
                    [ "$private" = "true" ] && continue
                    name=$(jq -r '.name' "$manifest")
                    version=$(jq -r '.version' "$manifest")
                    before=$(awk -v name="$name" '$1 == name { print $2 }' "$RUNNER_TEMP/versions-before.txt")
                    [ "$version" = "$before" ] && continue
                    changed=$((changed + 1))
                    case "$version" in
                      *-dev.*) echo "::notice::$name $before -> $version" ;;
                      *) echo "::error::$name is $version, not a dev prerelease"; fail=1 ;;
                    esac
                  done
                  # A cut that bumps nothing would publish nothing and report
                  # success, which reads as "it shipped".
                  if [ "$changed" -eq 0 ]; then
                    echo "::error::The snapshot bump changed no versions, so there is nothing to publish."
                    fail=1
                  fi
                  [ "$fail" -eq 0 ]

            - run: pnpm build

            # Publishing goes the same way product-sdk-release.yml sends it:
            # pack here, upload, and hand off to paritytech/npm_publish_automation,
            # which holds the organization NPM_TOKEN. This runner has no npm
            # credential of its own and must not grow one.
            - name: Pack packages
              run: |
                  mkdir -p artifacts
                  for package in packages/*/; do
                    if [ -f "$package/package.json" ]; then
                      (cd "$package" && pnpm pack --pack-destination ../../artifacts/)
                    fi
                  done

            - name: Upload package artifacts
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: packages
                  path: product-sdk/artifacts/*.tgz

            # `npm_tag: dev` is what keeps `@latest` untouched. Without it the
            # automation publishes to `latest`, and npm does NOT special-case a
            # prerelease version there. Consumers opt in explicitly with
            # `npm install @parity/product-sdk-host@dev` or by pinning.
            - name: Publish via npm_publish_automation under the dev tag
              uses: octokit/request-action@02f5e7c637a73a3b12ed81015fa7fb5f11cc5d7d # v2.x
              with:
                  route: POST /repos/paritytech/npm_publish_automation/actions/workflows/publish.yml/dispatches
                  ref: main
                  inputs: '${{ format(''{{ "repo": "{0}", "run_id": "{1}", "npm_tag": "dev" }}'', github.repository, github.run_id) }}'
              env:
                  GITHUB_TOKEN: ${{ secrets.NPM_PUBLISH_AUTOMATION_TOKEN }}

            # These versions were DISPATCHED, not confirmed. The publish
            # happens in npm_publish_automation, which opens an issue here on
            # failure. A green run means the versions were handed off, not that
            # they reached the registry.
            - name: Report what was dispatched
              run: |
                  set -euo pipefail
                  for manifest in packages/*/package.json; do
                    private=$(jq -r '.private // false' "$manifest")
                    [ "$private" = "true" ] && continue
                    name=$(jq -r '.name' "$manifest")
                    version=$(jq -r '.version' "$manifest")
                    # Unchanged packages were skipped by npm_publish_automation.
                    # Listing them here would claim a release that never went out.
                    before=$(awk -v name="$name" '$1 == name { print $2 }' "$RUNNER_TEMP/versions-before.txt")
                    [ "$version" = "$before" ] && continue
                    echo "::notice::dispatched $name@$version"
                  done
