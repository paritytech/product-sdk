name: "product-sdk: Changeset location"

# Guards the pending-changesets/ staging convention. Anything under
# `.changeset/` is picked up by the release workflow on the next push to
# `main`, so a changeset parked there by an in-flight PR gets published the
# moment any *unrelated* PR merges. See product-sdk/pending-changesets/README.md.
#
# Deliberately NOT path-filtered on `product-sdk/**` like the other workflows:
# a filtered workflow reports no status on PRs that don't match, which leaves a
# required check waiting forever. This one always runs so it can be required.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: changeset-location-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: "product-sdk: Changeset location"
    runs-on: parity-default
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Full history so the three-dot diff against the PR base resolves.
          fetch-depth: 0
          persist-credentials: false

      - name: Reject changesets authored directly into .changeset/
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Diffing the whole PR (three-dot) rather than the pushed commit, so
          # adding a changeset and moving it in a later commit ends up green.
          #
          # --no-renames makes a legitimate promotion show up as an add under
          # .changeset/ plus a delete of the same basename under
          # pending-changesets/. The awk pass cancels those against each other;
          # whatever add is left over was authored straight into .changeset/.
          #
          # `sort` because array iteration order in awk is unspecified, and the
          # runners use mawk, which has no asorti.
          mapfile -t offenders < <(
            git diff --no-renames --name-status "$BASE_SHA"...HEAD | awk '
              $1=="A" && $2 ~ /^product-sdk\/\.changeset\/[^\/]+\.md$/ {
                n = split($2, p, "/")
                if (tolower(p[n]) != "readme.md") added[p[n]] = $2
              }
              $1=="D" && $2 ~ /^product-sdk\/pending-changesets\/[^\/]+\.md$/ {
                n = split($2, p, "/"); promoted[p[n]] = 1
              }
              END { for (f in added) if (!(f in promoted)) print added[f] }
            ' | sort
          )

          [ ${#offenders[@]} -eq 0 ] && exit 0

          # One annotation per file so it renders inline in the Files changed tab.
          for f in "${offenders[@]}"; do
            echo "::error file=$f,line=1,title=Changeset must be in pending-changesets/::Anything under .changeset/ ships on the next merge to main. Run: git mv $f product-sdk/pending-changesets/$(basename "$f")"
          done

          echo
          echo "Changesets belong in product-sdk/pending-changesets/, not .changeset/."
          echo "Anything under .changeset/ ships on the next merge to main."
          echo
          for f in "${offenders[@]}"; do
            echo "    git mv $f product-sdk/pending-changesets/$(basename "$f")"
          done
          echo
          echo "A separate chore(release): PR promotes them back when the wave goes out."
          echo "See product-sdk/pending-changesets/README.md"
          exit 1
