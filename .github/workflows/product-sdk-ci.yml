name: "product-sdk: CI"

on:
  push:
    branches: [main]
    paths:
      - "product-sdk/**"
      - ".github/workflows/product-sdk-ci.yml"
  pull_request:
    branches: [main]

# Read-only build/test pipeline: only needs to clone the repo. Per-job grants
# below if anything ever needs to write.
permissions:
  contents: read

# Cancel in-flight runs on the same PR / ref so a quick succession of pushes
# doesn't queue a backlog of redundant CI runs.
concurrency:
  group: product-sdk-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: product-sdk

jobs:
  # The jobs below are required checks, so the PR trigger has no `paths:`
  # filter: this job decides whether they need to run. See changed-paths.sh.
  changes:
    name: "product-sdk: Detect changes"
    runs-on: parity-default
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        working-directory: .
        run: bash .github/scripts/changed-paths.sh '^(product-sdk/|\.github/workflows/product-sdk-ci\.yml$|\.github/scripts/changed-paths\.sh$)'

  check:
    name: "product-sdk: Lint & Format"
    needs: changes
    # Runs unless nothing relevant changed; a failed detector runs it anyway.
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: parity-default
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: product-sdk/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting & linting
        run: pnpm check

  build:
    name: "product-sdk: Build"
    needs: changes
    # Runs unless nothing relevant changed; a failed detector runs it anyway.
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: parity-default
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: product-sdk/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # Strict typecheck of every package's src + tests. Runs after build so it
      # sees each package's current `.d.ts` (workspace deps resolve to dist) and
      # the generated descriptors. Catches errors vitest's transform and the
      # per-package tsup build both skip (tests aren't emitted).
      - name: Typecheck
        run: pnpm typecheck

  test:
    name: "product-sdk: Test"
    needs: changes
    # Runs unless nothing relevant changed; a failed detector runs it anyway.
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: parity-default
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: product-sdk/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test
