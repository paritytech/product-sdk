name: "docs: Verify Build"

on:
    # The build job is a required check, so the PR trigger has no `paths:`
    # filter: the `changes` job decides whether it runs. See changed-paths.sh.
    push:
        branches: [main]
        paths:
            - "product-sdk/**"
            - "docs/**"
            - ".github/workflows/docs-verify.yml"
            - ".github/workflows/docs-deploy.yml"
            - ".github/scripts/check-docs-deploy.sh"
    pull_request:
        branches: [main]

# Read-only build: only needs to clone the repo to verify it builds.
permissions:
    contents: read

# Cancel in-flight runs on the same PR / ref so a quick succession of pushes
# doesn't queue a backlog of redundant verifies.
concurrency:
    group: docs-verify-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        name: "docs: Detect changes"
        runs-on: parity-default
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
        outputs:
            run: ${{ steps.paths.outputs.run }}
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  persist-credentials: false
                  sparse-checkout: .github/scripts
            - id: paths
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: bash .github/scripts/changed-paths.sh '^(product-sdk/|docs/|\.github/workflows/docs-(verify|deploy)\.yml$|\.github/scripts/(check-docs-deploy|changed-paths)\.sh$)'

    build:
        name: "docs: Verify Generate & Build"
        needs: changes
        # Runs unless nothing relevant changed; a failed detector runs it anyway.
        if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
        runs-on: parity-default
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  # Verify-only job; clear the token from .git/config after checkout
                  # so subsequent steps can't accidentally exfiltrate it.
                  persist-credentials: false

            - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
              with:
                  version: 10

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "22"
                  cache: "pnpm"
                  cache-dependency-path: |
                      product-sdk/pnpm-lock.yaml
                      docs/pnpm-lock.yaml

            - name: Install SDK deps
              working-directory: product-sdk
              run: pnpm install --frozen-lockfile

            - name: Build SDK packages
              working-directory: product-sdk
              run: pnpm build

            - name: Install docs deps
              working-directory: docs
              run: pnpm install --frozen-lockfile

            - name: Generate API Reference docs
              working-directory: docs
              run: pnpm docs:generate

            - name: Build static site
              working-directory: docs
              run: pnpm build

    bulletin-domain:
        name: "docs: Bulletin deploy guard"
        runs-on: parity-default
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  persist-credentials: false

            - name: Check the deploy workflow
              run: bash .github/scripts/check-docs-deploy.sh
